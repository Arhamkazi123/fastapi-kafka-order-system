# =============================================================================
# Order System — Local Development Stack
#
# Services:
#   - kafka:     Apache Kafka 3.7.0 in KRaft mode (no Zookeeper)
#   - kafbat-ui: Web dashboard for Kafka
#
# Usage:
#   docker compose up -d          → start everything
#   docker compose down           → stop everything
#   docker compose down -v        → stop + wipe all data
#   docker compose logs -f kafka  → watch kafka logs
#
# Access:
#   Kafka broker:  localhost:9092
#   Kafbat UI:     http://localhost:8080
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Apache Kafka 3.7.0 — KRaft mode (no Zookeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: order-system-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # PLAINTEXT → Kafbat UI (internal Docker network)
      # CONTROLLER → KRaft internal
      # EXTERNAL → your FastAPI app + workers (from Mac)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Topics are created explicitly via scripts/create_topics.py
      # Keeping auto-create ON for convenience during development
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"

      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      # Must match the CLUSTER_ID used if you ever mount a volume
      CLUSTER_ID: "T3JkZXJTeXN0ZW1LYWZrYQ=="

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - order-net

  # ---------------------------------------------------------------------------
  # Kafbat UI — full control, no read-only
  # ---------------------------------------------------------------------------
  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: order-system-kafbat
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: order-system
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - order-net

networks:
  order-net:
    driver: bridge

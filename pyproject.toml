[project]
name = "order-system"
version = "0.1.0"
description = "Real-time order processing system — FastAPI + Kafka + SQLite"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",

    # Database
    "sqlmodel==0.0.22",

    # Kafka
    "confluent-kafka==2.6.1",

    # Auth
    "pyjwt==2.10.0",
    "pwdlib[argon2]==0.2.1",

    # Config / env
    "python-dotenv==1.0.1",
]

[tool.uv]
